name: Daily Podcast Pipeline

on:
  schedule:
    # Run daily at 22:00 UTC (6:00 AM Beijing time)
    - cron: "0 22 * * *"
  workflow_dispatch:  # Manual trigger

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish podcast
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python main.py

      - name: Deploy feed to feed branch
        run: |
          git config user.name "Podcast Bot"
          git config user.email "bot@johnny-bread.podcast"
          git checkout --orphan feed 2>/dev/null || git checkout feed
          git rm -rf . 2>/dev/null || true
          cp -r ../feed/* . 2>/dev/null || true
          git add .
          git commit -m "Update RSS feed - $(date +%Y-%m-%d)" || echo "No changes"
          git push -f "https://${{ secrets.GHP_TOKEN }}@github.com/zhoutaihuangniubi/JohnnyZhou2.git" feed
